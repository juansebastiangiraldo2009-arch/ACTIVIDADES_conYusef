<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto css</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header class="sticky top-0 z-[1000] bg-[#1a1a1a] shadow-[0_2px_10px_rgba(0,0,0,0.1)]">
        <nav class="mx-auto max-w-[1200px] px-5 py-[15px]">
            <ul class="m-0 flex list-none justify-center gap-[30px] p-0">
                <li><a href="index.html"
                        class="text-base font-medium uppercase tracking-[1px] text-white no-underline transition-all duration-300 ease-in-out hover:text-[#007bff]">Texto</a>
                </li>
                <li><a href="transicion.html"
                        class="text-base font-medium uppercase tracking-[1px] text-white no-underline transition-all duration-300 ease-in-out hover:text-[#007bff]">Transiciones</a>
                </li>
                <li><a href="tamanio.html"
                        class="text-base font-medium uppercase tracking-[1px] text-white no-underline transition-all duration-300 ease-in-out hover:text-[#007bff]">Tamaño</a>
                </li>
                <li><a href="contenedores.html"
                        class="text-base font-medium uppercase tracking-[1px] text-white no-underline transition-all duration-300 ease-in-out hover:text-[#007bff]">Contenedores</a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="flex min-h-screen flex-col justify-between gap-8 p-6">


        <div class="mx-auto flex w-full max-w-sm items-center gap-x-4
            rounded-xl bg-white p-6 shadow-lg outline outline-black/5
            dark:bg-slate-800 dark:shadow-none dark:-outline-offset-1
            dark:outline-white/10">
            <img class="size-12 shrink-0" src="./images/imagencss.jpg" alt="ChitChat Logo" />
            <div>
                <div class="text-xl font-medium text-black dark:text-white">Proyecto css</div>
                <p class="text-gray-500 dark:text-gray-400">Todas las etiquetas</p>
            </div>
        </div>

        <div class="mx-auto grid w-full max-w-6xl grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">


            <div class="rounded-2xl bg-blue-600 p-4 text-white">
                <div class="mb-3 flex h-28 items-center justify-center rounded-xl bg-white">
                    <p class="text-blue-600">holi</p>
                </div>
                <h3 class="font-bold">color</h3>
                <p class="text-sm">Tailwind: text-blue-300</p>
            </div>

            <div class="rounded-2xl bg-blue-600 p-4 text-white">
                <div class="mb-3 flex h-28 items-center justify-center rounded-xl bg-white">
                    <div class="bg-yellow-500">Hola</div>
                </div>
                <h3 class="font-bold">fondo del texto</h3>
                <p class="text-sm">Tailwind: bg-yellow-500</p>
            </div>

            <div class="rounded-2xl bg-blue-600 p-4 text-white">

                <div class="mb-3 flex h-28 items-center justify-center rounded-xl bg-white">
                    <p class="text-xl font-bold text-gray-800 [text-shadow:2px_2px_4px_rgba(0,0,0,0.4)]">hola</p>
                </div>
                <h3 class="font-bold">sombra del texto</h3>
                <p class="text-sm">Tailwind: text-shadow-lg</p>
            </div>

        </div>
    </div>
</body>

</html>
