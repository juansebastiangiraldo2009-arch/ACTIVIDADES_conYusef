<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-400 min-h-screen py-10 px-4 flex flex-col items-center justify-center">

    <h1 class="text-black text-4xl font-bold mb-8 text-center">Nuestros Productos</h1>

    <div class="max-w-6xl w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col justify-between transform hover:-translate-y-2 hover:shadow-2xl transition duration-300">
            <div>
                <img src="./images/bolso.jpeg" alt="Producto 1" class="w-full h-48 object-cover">
                
                <div class="p-5">
                    <h2 class="text-xl font-bold text-gray-800 mt-3 mb-2">Bolso</h2>
                    <p class="text-gray-600 text-sm leading-relaxed">
                        Bolso mordido superdry
                    </p>
                </div>
            </div>
            
            <div class="p-5 pt-0 flex items-center justify-between mt-auto">
                <span class="text-2xl font-extrabold text-cyan-900">$42.000</span>
                <button class="bg-cyan-600 hover:bg-cyan-800 text-white font-medium py-2 px-4 rounded-xl shadow transition duration-200">
                    Comprar
                </button>
            </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col justify-between transform hover:-translate-y-2 hover:shadow-2xl transition duration-300">
            <div>
                <img src="./images/celular.jpeg" alt="Producto 2" class="w-full h-48 object-cover">
                
                <div class="p-5">            
                    <h2 class="text-xl font-bold text-gray-800 mt-3 mb-2">Celular</h2>
                    <p class="text-gray-600 text-sm leading-relaxed">
                        Celular con dolar
                    </p>

                </div>
            </div>
            
            <div class="p-5 pt-0 flex items-center justify-between mt-auto">
                <span class="text-2xl font-extrabold text-cyan-900">$2.000.000</span>
                <button class="bg-cyan-600 hover:bg-cyan-800 text-white font-medium py-2 px-4 rounded-xl shadow transition duration-200">
                    Comprar
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col justify-between transform hover:-translate-y-2 hover:shadow-2xl transition duration-300">
            <div>

                <img src="./images/portatil.jpeg" alt="Producto 3" class="w-full h-48 object-cover">
                
                <!-- Contenido de la Card -->
                <div class="p-5">            
                    <h2 class="text-xl font-bold text-gray-800 mt-3 mb-2">Portatil</h2>
                    <p class="text-gray-600 text-sm leading-relaxed">
                        Portatil en buen estado del sena
                    </p>
                </div>
            </div>
            
            <div class="p-5 pt-0 flex items-center justify-between mt-auto">
                <span class="text-2xl font-extrabold text-cyan-900">3.500.000</span>
                <button class="bg-cyan-600 hover:bg-cyan-800 text-white font-medium py-2 px-4 rounded-xl shadow transition duration-200">
                    Comprar
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col justify-between transform hover:-translate-y-2 hover:shadow-2xl transition duration-300">
            <div>
                <img src="./images/silla.jpeg" alt="Producto 4" class="w-full h-48 object-cover">
                
                <div class="p-5">
            
                    <h2 class="text-xl font-bold text-gray-800 mt-3 mb-2">Silla</h2>
                    <p class="text-gray-600 text-sm leading-relaxed">
                        Silla mordida del Sena
                    </p>
                </div>
            </div>
            
            <div class="p-5 pt-0 flex items-center justify-between mt-auto">
                <span class="text-2xl font-extrabold text-cyan-900">$79.000</span>
                <button class="bg-cyan-600 hover:bg-cyan-800 text-white font-medium py-2 px-4 rounded-xl shadow transition duration-200">
                    Comprar
                </button>
            </div>
        </div>

    </div>

</body>
</html>
